en:
  label_issue_ical_subscribe: "Calendar subscription"
  label_issue_ical_my_issues: "My issues"
  label_issue_ical_project_issues: "Issues of %{project}"
  label_issue_ical_feed_url: "Calendar feed URL"
  label_issue_ical_open_webcal: "Open in Apple Calendar / Outlook"
  label_issue_ical_add_google: "Add to Google Calendar"
  label_issue_ical_display: "Calendar status display"
  label_issue_ical_display_mark: "✔ on closed"
  label_issue_ical_display_ox: "O closed / X open"
  label_issue_ical_display_status: "Status name (e.g. [New])"
  label_issue_ical_display_plain: "No marker"
  label_issue_ical_display_hide: "Hide closed issues"
  label_issue_ical_my_feed: "Calendar: my issues"
  label_issue_ical_include_watched: "Include watched issues"
  label_issue_ical_change_setting: "Change"
  text_issue_ical_display_setting: "Status display: %{value}."
  button_issue_ical_copy: "Copy"
  text_issue_ical_copied: "Copied"
  text_issue_ical_intro: "Subscribe to this URL in your calendar app (add calendar from URL). Issue start and due dates show up as events (all-day, or timed when the issue has a start time) and are refreshed by the app."
  text_issue_ical_key_warning: "The URL contains your Atom access key, which also opens all of your Atom feeds. Keep it private and reset the key under My account if it leaks."
  text_issue_ical_tracker_hint: "Pick a tracker to get a calendar of only that tracker. Subscribe to each tracker separately to color or toggle them in your calendar app."
  label_issue_ical_start_time_field: "Start time field"
  label_issue_ical_end_time_field: "End time field"
  label_issue_ical_location_field: "Location field"
  error_issue_ical_time_pair: "%{missing} is required when %{given} is filled in (the calendar needs both times)"
  label_issue_ical_alarm_field: "Alarm field"
  text_issue_ical_alarm_field_hint: "A list field (multiple values allowed) with values such as \"At time of event\", \"15 minutes before\", \"1 day before\", \"10 minutes before end\" (Korean: 정시, 15분 전, 1일 전, 끝나기 10분 전). \"None\" asks the app not to add its default alarm. All-day events count from 09:00. Google Calendar ignores alarms in subscribed calendars."
  label_issue_ical_client_field: "Client field (project)"
  text_issue_ical_client_field_hint: "Event titles become \"Client-Subject(#123)\", or \"Subject(#123)\" when the project has no client. Without this field: \"[Project] Tracker #123: Subject\"."
  label_issue_ical_time_zone: "Time zone of the times"
  label_issue_ical_time_zone_server: "Server time zone (%{zone})"
  text_issue_ical_time_fields_intro: "Pick the issue custom fields (format: Text) that hold a start and an end time such as 09:30. Issues with a start time become timed events from the start date at the start time to the due date at the end time; the others stay all-day. The location field is shown as the event location."
  text_issue_ical_time_zone_hint: "Used for users who have not set a time zone in their preferences."
