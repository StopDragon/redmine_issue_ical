  button_issue_ical_copy: "복사"
  text_issue_ical_copied: "복사됨"
  text_issue_ical_intro: "이 주소를 캘린더 앱에 URL로 구독하세요. 일감의 시작일~완료기한이 일정으로 들어가고(시작 시간이 있으면 시간 일정, 없으면 종일), 캘린더 앱이 주기적으로 새로 고칩니다."
  text_issue_ical_key_warning: "주소에 든 Atom 접근키로 내 모든 Atom 피드를 읽을 수 있으니 비밀번호처럼 다루고, 유출되면 내 계정에서 키를 초기화하세요."
  text_issue_ical_tracker_hint: "유형을 고르면 그 유형만 담긴 캘린더 주소가 됩니다. 유형마다 따로 구독하면 캘린더 앱에서 색을 다르게 하거나 켜고 끌 수 있습니다."
  label_issue_ical_start_time_field: "시작 시간 필드"
  label_issue_ical_end_time_field: "종료 시간 필드"
  label_issue_ical_time_zone: "시간의 기준 시간대"
  label_issue_ical_time_zone_server: "서버 시간대 (%{zone})"
  text_issue_ical_time_fields_intro: "09:30 같은 시작·종료 시간을 담은 일감 사용자 정의 필드(형식: 문자열)를 고르세요. 시작 시간이 있는 일감은 시작일 시작 시간부터 완료기한 종료 시간까지의 시간 일정이 되고, 나머지는 종일 일정으로 남습니다."
  text_issue_ical_time_zone_hint: "개인 설정에 시간대를 정하지 않은 사용자에게 쓰입니다."
